name: Cep Bağlama APK

on:
  workflow_dispatch:
  push:
    branches:
      - ana

jobs:
  build:
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - name: GitHub deposunu al
        uses: actions/checkout@v4

      - name: Java 17 kur
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Gradle kur
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Android projesini ZIP'ten çıkar
        run: |
          ZIP_FILE=$(find . -maxdepth 1 -type f -iname '*Cep-Baglama-Pro-Android*.zip' | head -n 1)

          if [ -z "$ZIP_FILE" ]; then
            echo "Android ZIP dosyası bulunamadı!"
            exit 1
          fi

          echo "Bulunan ZIP: $ZIP_FILE"

          mkdir -p android-project
          unzip -q "$ZIP_FILE" -d android-project

          echo "Android proje dosyaları:"
          find android-project -maxdepth 2 -type f | head -50

      - name: APK oluştur
        working-directory: android-project
        run: |
          gradle :app:assembleDebug --no-daemon

      - name: APK'yı yükle
        uses: actions/upload-artifact@v4
        with:
          name: Cep-Baglama-Pro-APK
          path: android-project/app/build/outputs/apk/debug/app-debug.apk
