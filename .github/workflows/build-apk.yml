name: Cep Bağlama APK

on:
  workflow_dispatch:

  push:
    branches:
      - main
      - ana

jobs:
  build:
    name: Cep Bağlama APK Oluştur
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:

      - name: GitHub deposunu al
        uses: actions/checkout@v4

      - name: Java 17 kur
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Gradle kur
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Android projesini oluştur
        shell: bash
        run: |

          echo "Android projesi hazırlanıyor..."

          mkdir -p android-project/app/src/main/java/com/cepbaglama/pro
          mkdir -p android-project/app/src/main/res/values
          mkdir -p android-project/app/src/main/assets

          # GitHub'daki çalışan internet sitesini
          # doğrudan APK'nın içine kopyala
          cp index.html android-project/app/src/main/assets/index.html

          cat > android-project/settings.gradle.kts <<'EOF'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }

          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)

              repositories {
                  google()
                  mavenCentral()
              }
          }

          rootProject.name = "CepBaglamaPro"

          include(":app")
          EOF

          cat > android-project/build.gradle.kts <<'EOF'
          plugins {
              id("com.android.application") version "8.7.3" apply false
          }
          EOF

          cat > android-project/gradle.properties <<'EOF'
          org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
          android.useAndroidX=false
          EOF

          cat > android-project/app/build.gradle.kts <<'EOF'
          plugins {
              id("com.android.application")
          }

          android {
              namespace = "com.cepbaglama.pro"

              compileSdk = 35

              defaultConfig {
                  applicationId = "com.cepbaglama.pro"

                  minSdk = 23

                  targetSdk = 35

                  versionCode = 2

                  versionName = "2.0"
              }

              buildTypes {

                  debug {
                      isMinifyEnabled = false
                  }

                  release {
                      isMinifyEnabled = false
                  }
              }
          }

          dependencies {
          }
          EOF

          cat > android-project/app/src/main/res/values/strings.xml <<'EOF'
          <resources>
              <string name="app_name">Cep Bağlama Pro</string>
          </resources>
          EOF

          cat > android-project/app/src/main/res/values/styles.xml <<'EOF'
          <resources>

              <style name="AppTheme"
                  parent="@android:style/Theme.Material.NoActionBar">

                  <item name="android:fontFamily">sans</item>

                  <item name="android:windowActionModeOverlay">true</item>

                  <item name="android:colorAccent">#FF9800</item>

                  <item name="android:navigationBarColor">#000000</item>

                  <item name="android:statusBarColor">#000000</item>

                  <item name="android:windowLightStatusBar">false</item>

              </style>

          </resources>
          EOF

          cat > android-project/app/src/main/AndroidManifest.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>

          <manifest xmlns:android="http://schemas.android.com/apk/res/android">

              <uses-permission android:name="android.permission.VIBRATE" />

              <application
                  android:allowBackup="false"
                  android:label="@string/app_name"
                  android:theme="@style/AppTheme"
                  android:hardwareAccelerated="true">

                  <activity
                      android:name=".MainActivity"
                      android:screenOrientation="portrait"
                      android:exported="true">

                      <intent-filter>

                          <action android:name="android.intent.action.MAIN" />

                          <category android:name="android.intent.category.LAUNCHER" />

                      </intent-filter>

                  </activity>

              </application>

          </manifest>
          EOF

          cat > android-project/app/src/main/java/com/cepbaglama/pro/MainActivity.java <<'EOF'
          package com.cepbaglama.pro;

          import android.app.Activity;
          import android.os.Bundle;
          import android.view.View;
          import android.webkit.WebChromeClient;
          import android.webkit.WebSettings;
          import android.webkit.WebView;
          import android.webkit.WebViewClient;

          import java.io.BufferedReader;
          import java.io.InputStream;
          import java.io.InputStreamReader;

          public class MainActivity extends Activity {

              private WebView webView;

              @Override
              protected void onCreate(Bundle savedInstanceState) {

                  super.onCreate(savedInstanceState);

                  webView = new WebView(this);

                  setContentView(webView);

                  WebSettings settings = webView.getSettings();

                  settings.setJavaScriptEnabled(true);

                  settings.setDomStorageEnabled(true);

                  settings.setMediaPlaybackRequiresUserGesture(false);

                  settings.setBuiltInZoomControls(false);

                  settings.setDisplayZoomControls(false);

                  settings.setSupportZoom(false);

                  settings.setLoadWithOverviewMode(false);

                  settings.setUseWideViewPort(false);

                  settings.setAllowFileAccess(true);

                  settings.setAllowContentAccess(true);

                  webView.setWebViewClient(new WebViewClient());

                  webView.setWebChromeClient(new WebChromeClient());

                  webView.setVerticalScrollBarEnabled(false);

                  webView.setHorizontalScrollBarEnabled(false);

                  webView.setOverScrollMode(View.OVER_SCROLL_NEVER);

                  loadLocalHtml();
              }

              private void loadLocalHtml() {

                  try {

                      InputStream inputStream =
                              getAssets().open("index.html");

                      BufferedReader reader =
                              new BufferedReader(
                                      new InputStreamReader(
                                              inputStream,
                                              "UTF-8"
                                      )
                              );

                      StringBuilder html =
                              new StringBuilder();

                      String line;

                      while ((line = reader.readLine()) != null) {

                          html.append(line);
                          html.append("\n");
                      }

                      reader.close();

                      inputStream.close();

                      webView.loadDataWithBaseURL(
                              "https://cepbaglama.local/",
                              html.toString(),
                              "text/html",
                              "UTF-8",
                              null
                      );

                  } catch (Exception e) {

                      String error =
                              "<html><body style='background:#111;color:white;padding:30px;font-family:sans-serif'>" +
                              "<h2>Cep Bağlama Pro</h2>" +
                              "<p>Uygulama içeriği yüklenemedi.</p>" +
                              "<p>" + e.getMessage() + "</p>" +
                              "</body></html>";

                      webView.loadDataWithBaseURL(
                              "https://cepbaglama.local/",
                              error,
                              "text/html",
                              "UTF-8",
                              null
                      );
                  }
              }

              @Override
              public void onBackPressed() {

                  if (webView.canGoBack()) {

                      webView.goBack();

                  } else {

                      super.onBackPressed();
                  }
              }

              @Override
              protected void onDestroy() {

                  if (webView != null) {

                      webView.destroy();
                  }

                  super.onDestroy();
              }
          }
          EOF

          echo "Android projesi hazır."

      - name: Dosyaları kontrol et
        shell: bash
        run: |

          echo "index.html kontrol ediliyor..."

          test -f index.html

          test -f android-project/app/src/main/assets/index.html

          test -f android-project/app/src/main/java/com/cepbaglama/pro/MainActivity.java

          test -f android-project/app/src/main/AndroidManifest.xml

          echo "Tüm dosyalar hazır."

      - name: APK oluştur
        working-directory: android-project
        shell: bash
        run: |

          gradle :app:assembleDebug --no-daemon --stacktrace

      - name: APK kontrol
        shell: bash
        run: |

          APK="android-project/app/build/outputs/apk/debug/app-debug.apk"

          if [ ! -f "$APK" ]; then

              echo "APK oluşturulamadı!"

              exit 1

          fi

          echo "APK BAŞARIYLA OLUŞTURULDU."

          ls -lh "$APK"

      - name: APK'yı yükle
        uses: actions/upload-artifact@v4
        with:
          name: Cep-Baglama-Pro-APK
          path: android-project/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
