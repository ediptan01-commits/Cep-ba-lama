name: Android APK'ları

on:
  workflow_dispatch:

  push:
    branches:
      - main
      - ana

jobs:
  build:
    name: Cep Bağlama APK Oluştur
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:

      - name: GitHub deposunu al
        uses: actions/checkout@v4

      - name: Java 17 kur
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Gradle kur
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Android projesini oluştur
        shell: bash
        run: |

          mkdir -p android-project/app/src/main/java/com/cepbaglama/pro
          mkdir -p android-project/app/src/main/res/values

          cat > android-project/settings.gradle.kts <<'EOF'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }

          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)

              repositories {
                  google()
                  mavenCentral()
              }
          }

          rootProject.name = "CepBaglamaPro"
          include(":app")
          EOF

          cat > android-project/build.gradle.kts <<'EOF'
          plugins {
              id("com.android.application") version "8.7.3" apply false
          }
          EOF

          cat > android-project/gradle.properties <<'EOF'
          org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
          android.useAndroidX=true
          android.nonTransitiveRClass=true
          EOF

          cat > android-project/app/build.gradle.kts <<'EOF'
          plugins {
              id("com.android.application")
          }

          android {
              namespace = "com.cepbaglama.pro"
              compileSdk = 35

              defaultConfig {
                  applicationId = "com.cepbaglama.pro"
                  minSdk = 23
                  targetSdk = 35
                  versionCode = 1
                  versionName = "1.0"
              }

              buildTypes {
                  release {
                      isMinifyEnabled = false
                  }
              }
          }

          configurations.configureEach {
              resolutionStrategy {
                  force(
                      "org.jetbrains.kotlin:kotlin-stdlib:1.8.22",
                      "org.jetbrains.kotlin:kotlin-stdlib-jdk7:1.8.22",
                      "org.jetbrains.kotlin:kotlin-stdlib-jdk8:1.8.22"
                  )
              }
          }

          dependencies {
              implementation("androidx.appcompat:appcompat:1.7.0")
              implementation("androidx.webkit:webkit:1.12.1")
          }
          EOF

          cat > android-project/app/src/main/res/values/strings.xml <<'EOF'
          <resources>
              <string name="app_name">Cep Bağlama</string>
          </resources>
          EOF

          cat > android-project/app/src/main/res/values/colors.xml <<'EOF'
          <resources>
              <color name="black">#000000</color>
          </resources>
          EOF

          cat > android-project/app/src/main/res/values/themes.xml <<'EOF'
          <resources>

              <style name="Theme.CepBaglamaPro"
                  parent="Theme.AppCompat.DayNight.NoActionBar">

                  <item name="android:fontFamily">sans</item>
                  <item name="android:windowActionModeOverlay">true</item>
                  <item name="android:colorAccent">#FF6B00</item>

              </style>

          </resources>
          EOF

          cat > android-project/app/src/main/AndroidManifest.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>

          <manifest xmlns:android="http://schemas.android.com/apk/res/android">

              <uses-permission android:name="android.permission.INTERNET" />

              <application
                  android:allowBackup="true"
                  android:label="@string/app_name"
                  android:theme="@style/Theme.CepBaglamaPro"
                  android:usesCleartextTraffic="false">

                  <activity
                      android:name=".MainActivity"
                      android:screenOrientation="portrait"
                      android:exported="true">

                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>

                  </activity>

              </application>

          </manifest>
          EOF

          cat > android-project/app/src/main/java/com/cepbaglama/pro/MainActivity.java <<'EOF'
          package com.cepbaglama.pro;

          import android.annotation.SuppressLint;
          import android.os.Bundle;
          import android.webkit.WebChromeClient;
          import android.webkit.WebSettings;
          import android.webkit.WebView;
          import android.webkit.WebViewClient;

          import androidx.appcompat.app.AppCompatActivity;

          public class MainActivity extends AppCompatActivity {

              private WebView webView;

              @SuppressLint("SetJavaScriptEnabled")
              @Override
              protected void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);

                  webView = new WebView(this);
                  setContentView(webView);

                  WebSettings settings = webView.getSettings();

                  settings.setJavaScriptEnabled(true);
                  settings.setDomStorageEnabled(true);
                  settings.setMediaPlaybackRequiresUserGesture(false);
                  settings.setBuiltInZoomControls(false);
                  settings.setDisplayZoomControls(false);
                  settings.setLoadWithOverviewMode(false);
                  settings.setUseWideViewPort(false);

                  webView.setWebViewClient(new WebViewClient());
                  webView.setWebChromeClient(new WebChromeClient());

                  webView.loadUrl(
                      "https://ediptan01-commits.github.io/Cep-baglama/"
                  );
              }

              @Override
              public void onBackPressed() {
                  if (webView.canGoBack()) {
                      webView.goBack();
                  } else {
                      super.onBackPressed();
                  }
              }
          }
          EOF

          echo "Android projesi başarıyla oluşturuldu."

      - name: Android projesini kontrol et
        shell: bash
        run: |

          test -f android-project/settings.gradle.kts
          test -f android-project/build.gradle.kts
          test -f android-project/app/build.gradle.kts
          test -f android-project/app/src/main/AndroidManifest.xml
          test -f android-project/app/src/main/java/com/cepbaglama/pro/MainActivity.java

          echo "Tüm Android proje dosyaları hazır."

      - name: APK oluştur
        working-directory: android-project
        shell: bash
        run: |

          gradle :app:assembleDebug --no-daemon --stacktrace

      - name: APK kontrol
        shell: bash
        run: |

          APK="android-project/app/build/outputs/apk/debug/app-debug.apk"

          if [ ! -f "$APK" ]; then
              echo "APK oluşturulamadı!"
              exit 1
          fi

          echo "APK başarıyla oluşturuldu."
          ls -lh "$APK"

      - name: APK'yı yükle
        uses: actions/upload-artifact@v4
        with:
          name: Cep-Baglama-APK
          path: android-project/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
