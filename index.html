<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Cep Bağlama</title>

<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{
margin:0;
background:#0d0d0d;
color:#fff;
font-family:Arial,sans-serif;
overflow-x:hidden;
touch-action:manipulation;
}



header{
height:68px;padding:9px 16px;
display:flex;align-items:center;justify-content:space-between;
background:linear-gradient(135deg,#241207,#704018);
border-bottom:1px solid #a96629
}

.logo{font-size:23px;font-weight:bold}
.subtitle{color:#d8b48a;font-size:11px;margin-top:3px}

button,select{
border:0;border-radius:12px;
background:#743f16;color:white;
padding:10px 13px;font-size:14px
}

button:active{transform:scale(.95)}

.controls{
display:flex;gap:8px;padding:9px;
background:#181818;overflow-x:auto
}

.control{
min-width:115px;padding:8px;
background:#242424;border:1px solid #3b3b3b;
border-radius:12px
}

.control-title{color:#aaa;font-size:11px;margin-bottom:5px}

select{width:100%;background:#363636;padding:7px}
input[type=range]{width:100%}

.instrument{
position:relative;width:96%;max-width:1150px;height:510px;
margin:18px auto;overflow:hidden;border-radius:90px;
background:
radial-gradient(circle at 78% 50%,#080706 0 5%,#d48b3c 6% 10%,transparent 11%),
linear-gradient(90deg,#3b1c09,#7e4218,#ae6729,#713813,#351806);
box-shadow:0 18px 40px #000,inset 0 0 45px #251003
}

.neck{
position:absolute;left:2%;top:16%;width:73%;height:68%;
border-radius:25px 80px 80px 25px;
background:linear-gradient(#a3612d,#603316,#955325);
box-shadow:inset 0 0 20px #251004
}

.body{
position:absolute;right:4%;top:7%;width:35%;height:86%;
border-radius:50%;
background:
radial-gradient(circle at center,#090806 0 9%,#d68c3d 10% 16%,#914a1b 17% 100%);
box-shadow:inset 0 0 40px #2b1305,0 10px 25px #000
}

.frets{
position:absolute;left:6%;top:16%;width:67%;height:68%;
z-index:8;display:flex
}

.fret{
position:relative;height:100%;flex:1;
border-right:3px solid rgba(242,211,174,.7)
}

.fret:first-child{border-left:4px solid #e3ad70}

.fret.active{
background:rgba(255,190,80,.22);
box-shadow:inset 0 0 18px rgba(255,190,80,.5)
}

.fret-number{
position:absolute;bottom:3px;width:100%;
text-align:center;font-size:9px;color:#ddd;
opacity:.75;pointer-events:none
}

.strings{
position:absolute;left:4%;top:17%;width:91%;height:66%;
z-index:12;display:flex;flex-direction:column;
justify-content:space-between;pointer-events:none
}

.string{
position:relative;height:28px;pointer-events:auto
}

.string-line{
position:absolute;left:0;right:0;top:13px;height:2px;
background:#eee;box-shadow:0 0 5px white;
transition:.08s
}

.string.hit .string-line{
height:6px;background:#fff5c7;
box-shadow:0 0 18px white
}

.string-name{
position:absolute;left:3px;top:-1px;
font-size:11px;color:white;
text-shadow:0 2px 3px black
}

.finger{
position:absolute;width:34px;height:34px;
border-radius:50%;background:rgba(255,190,80,.9);
border:3px solid white;
box-shadow:0 0 20px #ffb34d;
z-index:30;transform:translate(-50%,-50%);
pointer-events:none;display:none
}

.note-panel{
width:96%;max-width:1150px;margin:10px auto;padding:14px;
text-align:center;border-radius:18px;
background:#1b1b1b;border:1px solid #383838
}

.note{
font-size:42px;font-weight:bold;color:#e4a655
}

.info{color:#aaa;margin-top:5px}

.actions{
display:flex;justify-content:center;gap:8px;
flex-wrap:wrap;margin-top:12px
}

.bottom{
width:96%;max-width:1150px;margin:10px auto 25px;
display:flex;justify-content:center;gap:9px;flex-wrap:wrap
}

.recording{background:#a52323!important}

@media(max-width:700px){
.instrument{height:430px;border-radius:65px}
.logo{font-size:20px}
.note{font-size:38px}
}

@media(orientation:landscape) and (max-height:600px){
header{height:52px}
.instrument{height:calc(100vh - 125px);margin:7px auto}
}
</style>
</head>

<body>

<header>
<div>
<div class="logo">🎸 Cep Bağlama</div>
<div class="subtitle">Dijital bağlama • 3.1 sürüm</div>
</div>
<button id="soundBtn">🔊 Sesi Aç</button>
</header>

<div class="controls">

<div class="control">
<div class="control-title">Sap</div>
<select id="sap">
<option value="kisa">Kısa Sap</option>
<option value="uzun">Uzun Sap</option>
</select>
</div>

<div class="control">
<div class="control-title">Düzen</div>
<select id="duzen">
<option value="baglama">Bağlama Düzeni</option>
<option value="bozuk">Bozuk Düzen</option>
<option value="kara">Kara Düzen</option>
</select>
</div>

<div class="control">
<div class="control-title">Ses</div>
<input id="volume" type="range" min="0" max="100" value="75">
</div>

<div class="control">
<div class="control-title">Titreşim</div>
<button id="vibration">Açık</button>
</div>

</div>

<div class="instrument" id="instrument">

<div class="neck"></div>
<div class="body"></div>

<div class="frets" id="frets"></div>

<div class="strings">

<div class="string" data-string="0">
<div class="string-name">SOL</div>
<div class="string-line"></div>
</div>

<div class="string" data-string="1">
<div class="string-name">SOL</div>
<div class="string-line"></div>
</div>

<div class="string" data-string="2">
<div class="string-name">RE</div>
<div class="string-line"></div>
</div>

<div class="string" data-string="3">
<div class="string-name">RE</div>
<div class="string-line"></div>
</div>

<div class="string" data-string="4">
<div class="string-name">LA</div>
<div class="string-line"></div>
</div>

<div class="string" data-string="5">
<div class="string-name">LA</div>
<div class="string-line"></div>
</div>

<div class="string" data-string="6">
<div class="string-name">Mİ</div>
<div class="string-line"></div>
</div>

</div>

<div class="finger" id="finger"></div>

</div>

<div class="note-panel">

<div class="note" id="note">—</div>

<div class="info" id="info">
Tele veya perdeye dokun.
</div>

<div class="actions">

<button id="down">↓ Aşağı Mızrap</button>
<button id="up">↑ Yukarı Mızrap</button>
<button id="record">🔴 Kayıt</button>
<button id="undo">↩ Son Notayı Sil</button>

</div>

</div>

<div class="bottom">

<button id="slow">🐢 Yavaş</button>
<button id="medium">▶ Orta</button>
<button id="fast">🔥 Hızlı</button>
<button id="stop">⏹ Ritim Durdur</button>

</div>

<script>

let audio=null;
let master=null;
let volume=.75;
let vibration=true;
let tuning="baglama";
let sap="kisa";
let lastString=0;
let lastFret=0;
let rhythmTimer=null;
let recording=false;
let recordStart=0;
let recordingData=[];
let history=[];

const tunings={
baglama:[196,196,146.83,146.83,110,110,73.42],
bozuk:[196,196,146.83,146.83,110,110,82.41],
kara:[220,220,164.81,164.81,110,110,82.41]
};

const noteNames=[
"DO","DO#","RE","RE#","Mİ","FA",
"FA#","SOL","SOL#","LA","LA#","Sİ"
];

function initAudio(){

if(!audio){

audio=new(window.AudioContext||window.webkitAudioContext)();

master=audio.createGain();
master.gain.value=volume;
master.connect(audio.destination);

}

if(audio.state==="suspended")audio.resume();

}

function getFrequency(string,fret){

return tunings[tuning][string]*
Math.pow(2,fret/12);

}

function getNoteName(freq){

let midi=Math.round(69+12*Math.log2(freq/440));
let index=((midi%12)+12)%12;

return noteNames[index];

}

function playNote(string,fret){

initAudio();

lastString=string;
lastFret=fret;

const freq=getFrequency(string,fret);
const now=audio.currentTime;

const osc=audio.createOscillator();
const gain=audio.createGain();

osc.type="triangle";
osc.frequency.setValueAtTime(freq,now);

gain.gain.setValueAtTime(.0001,now);
gain.gain.exponentialRampToValueAtTime(.62,now+.008);
gain.gain.exponentialRampToValueAtTime(.20,now+.18);
gain.gain.exponentialRampToValueAtTime(.0001,now+2);

osc.connect(gain);
gain.connect(master);

osc.start(now);
osc.stop(now+2.1);

const harmonic=audio.createOscillator();
const hg=audio.createGain();

harmonic.type="sine";
harmonic.frequency.value=freq*2;

hg.gain.setValueAtTime(.0001,now);
hg.gain.exponentialRampToValueAtTime(.12,now+.01);
hg.gain.exponentialRampToValueAtTime(.0001,now+.8);

harmonic.connect(hg);
hg.connect(master);

harmonic.start(now);
harmonic.stop(now+.9);

history.push({
string:string,
fret:fret,
frequency:freq
});

if(recording){

recordingData.push({
time:Date.now()-recordStart,
string:string,
fret:fret
});

}

showNote(string,fret,freq);

if(vibration&&navigator.vibrate)
navigator.vibrate(12);

}

function showNote(string,fret,freq){

document.getElementById("note").textContent=
getNoteName(freq);

document.getElementById("info").textContent=
"Tel "+(string+1)+
" • Perde "+fret+
" • "+freq.toFixed(1)+" Hz";

document.querySelectorAll(".string")
.forEach(x=>x.classList.remove("hit"));

const current=document.querySelector(
'.string[data-string="'+string+'"]'
);

if(current){

current.classList.add("hit");

setTimeout(()=>{
current.classList.remove("hit");
},130);

}

showFinger(string,fret);

}

function showFinger(string,fret){

const instrument=document.getElementById("instrument");
const finger=document.getElementById("finger");
const frets=document.getElementById("frets");

const rect=frets.getBoundingClientRect();
const instRect=instrument.getBoundingClientRect();

const count=sap==="kisa"?12:19;

const x=rect.left+
((fret+.5)/count)*rect.width;

const stringRect=document.querySelector(
'.string[data-string="'+string+'"]'
).getBoundingClientRect();

const y=stringRect.top+
stringRect.height/2;

finger.style.left=(x-instRect.left)+"px";
finger.style.top=(y-instRect.top)+"px";
finger.style.display="block";

}

function createFrets(){

const container=document.getElementById("frets");
container.innerHTML="";

const count=sap==="kisa"?12:19;

for(let i=0;i<count;i++){

const fret=document.createElement("div");
fret.className="fret";

const number=document.createElement("div");
number.className="fret-number";
number.textContent=i;

fret.appendChild(number);

fret.addEventListener("pointerdown",function(e){

e.preventDefault();

const rect=container.getBoundingClientRect();

const x=e.clientX-rect.left;

let fretIndex=Math.floor(
(x/rect.width)*count
);

fretIndex=Math.max(0,
Math.min(count-1,fretIndex));

const stringRect=document.querySelector(
".strings"
).getBoundingClientRect();

const y=e.clientY-stringRect.top;

let string=Math.floor(
(y/stringRect.height)*7
);

string=Math.max(0,Math.min(6,string));

document.querySelectorAll(".fret")
.forEach(f=>f.classList.remove("active"));

fret.classList.add("active");

playNote(string,fretIndex);

});

container.appendChild(fret);

}

}

function startRhythm(speed){

stopRhythm();
initAudio();

rhythmTimer=setInterval(()=>{

playNote(lastString,lastFret);

setTimeout(()=>{
playNote(Math.max(0,lastString-2),0);
},160);

},speed);

document.getElementById("info").textContent=
"Ritim açık";

}

function stopRhythm(){

if(rhythmTimer){
clearInterval(rhythmTimer);
rhythmTimer=null;
}

}

document.getElementById("soundBtn").onclick=()=>{

initAudio();

document.getElementById("soundBtn").textContent=
"🔊 Ses Açık";

};

document.getElementById("volume").oninput=e=>{

volume=Number(e.target.value)/100;

if(master)master.gain.value=volume;

};

document.getElementById("vibration").onclick=function(){

vibration=!vibration;
this.textContent=vibration?"Açık":"Kapalı";

};

document.getElementById("sap").onchange=e=>{

sap=e.target.value;
createFrets();

};

document.getElementById("duzen").onchange=e=>{

tuning=e.target.value;

document.getElementById("info").textContent=
"Akort: "+e.target.options[e.target.selectedIndex].text;

};

document.getElementById("down").onclick=()=>{

playNote(lastString,lastFret);

};

document.getElementById("up").onclick=()=>{

playNote(lastString,lastFret);

};

document.getElementById("record").onclick=function(){

if(!recording){

recording=true;
recordingData=[];
recordStart=Date.now();

this.textContent="⏹ Kaydı Durdur";
this.classList.add("recording");

document.getElementById("info").textContent=
"Kayıt yapılıyor...";

}else{

recording=false;

this.textContent="🔴 Kayıt";
this.classList.remove("recording");

document.getElementById("info").textContent=
"Kayıt tamamlandı • "+
recordingData.length+" nota";

}

};

document.getElementById("undo").onclick=()=>{

if(history.length===0){

document.getElementById("info").textContent=
"Silinecek nota yok.";

return;

}

history.pop();

document.getElementById("info").textContent=
"Son nota silindi.";

};

document.getElementById("slow").onclick=()=>{
startRhythm(700);
};

document.getElementById("medium").onclick=()=>{
startRhythm(500);
};

document.getElementById("fast").onclick=()=>{
startRhythm(320);
};

document.getElementById("stop").onclick=()=>{

stopRhythm();

document.getElementById("info").textContent=
"Ritim durduruldu.";

};

document.querySelectorAll(".string")
.forEach(string=>{

string.addEventListener("pointerdown",e=>{

e.preventDefault();

playNote(
Number(string.dataset.string),
0
);

});

});

createFrets();

</script>

</body>
</html>
