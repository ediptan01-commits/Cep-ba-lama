<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport"
content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">

<title>Cep Bağlama</title>

<style>
*{
box-sizing:border-box;
-webkit-tap-highlight-color:transparent;
}

body{
margin:0;
background:#0d0d0d;
color:#fff;
font-family:Arial,sans-serif;
overflow-x:hidden;
touch-action:manipulation;
}

header{
height:70px;
padding:10px 18px;
display:flex;
align-items:center;
justify-content:space-between;
background:linear-gradient(135deg,#25140a,#613514);
border-bottom:1px solid #9a5d25;
}

.logo{
font-size:24px;
font-weight:bold;
}

.subtitle{
color:#d8b58b;
font-size:12px;
margin-top:3px;
}

button,select{
border:0;
border-radius:12px;
background:#704017;
color:white;
padding:11px 15px;
font-size:14px;
}

button:active{
transform:scale(.95);
}

.controls{
display:flex;
gap:8px;
padding:10px;
background:#181818;
overflow-x:auto;
}

.control{
min-width:115px;
padding:9px;
background:#242424;
border:1px solid #393939;
border-radius:12px;
}

.control-title{
font-size:11px;
color:#aaa;
margin-bottom:6px;
}

select{
width:100%;
background:#353535;
padding:7px;
}

input[type=range]{
width:100%;
}

.instrument{
position:relative;
width:96%;
max-width:1150px;
height:500px;
margin:20px auto;
background:
radial-gradient(circle at 78% 50%,
#15100b 0 5%,
#d38a3d 6% 10%,
transparent 11%),
linear-gradient(90deg,#40200c,#8d4c1c,#b56a2b,#713914,#3c1c0a);
border-radius:90px;
box-shadow:
0 18px 40px #000,
inset 0 0 40px #241004;
overflow:hidden;
}

.body{
position:absolute;
right:4%;
top:8%;
width:34%;
height:84%;
border-radius:50%;
background:
radial-gradient(circle at center,
#0a0806 0 10%,
#d0873b 11% 17%,
#934c1b 18% 100%);
box-shadow:
inset 0 0 40px #301507,
0 10px 25px #000;
}

.neck{
position:absolute;
left:2%;
top:18%;
width:72%;
height:64%;
border-radius:25px 80px 80px 25px;
background:
linear-gradient(#9c5d2c,#5b3014,#9a5928);
box-shadow:inset 0 0 20px #2a1205;
}

.strings{
position:absolute;
left:4%;
top:19%;
width:91%;
height:62%;
z-index:10;
display:flex;
flex-direction:column;
justify-content:space-between;
}

.string{
height:28px;
position:relative;
cursor:pointer;
}

.string-line{
position:absolute;
left:0;
right:0;
top:13px;
height:2px;
background:#eee;
box-shadow:0 0 5px #fff;
transition:.08s;
}

.string.hit .string-line{
height:5px;
background:#fff8d5;
box-shadow:0 0 15px #fff;
}

.string-name{
position:absolute;
left:3px;
top:0;
font-size:11px;
color:#fff;
text-shadow:0 1px 3px #000;
}

.frets{
position:absolute;
left:7%;
top:18%;
width:66%;
height:64%;
z-index:6;
pointer-events:auto;
display:flex;
}

.fret{
height:100%;
flex:1;
border-right:3px solid rgba(245,210,165,.7);
position:relative;
}

.fret:first-child{
border-left:4px solid #e4b276;
}

.fret-label{
position:absolute;
bottom:5px;
left:50%;
transform:translateX(-50%);
font-size:9px;
color:rgba(255,255,255,.55);
}

.fret-touch{
position:absolute;
inset:0;
}

.fret-touch:active{
background:rgba(255,210,120,.15);
}

.note-display{
width:96%;
max-width:1150px;
margin:10px auto;
background:#1b1b1b;
border:1px solid #353535;
border-radius:18px;
padding:14px;
text-align:center;
}

.note{
font-size:38px;
font-weight:bold;
color:#e5aa5c;
}

.note-info{
color:#aaa;
margin-top:4px;
}

.mizrap{
display:flex;
justify-content:center;
gap:10px;
margin-top:12px;
}

.active{
background:#a6601e!important;
}

.bottom{
width:96%;
max-width:1150px;
margin:12px auto 30px;
display:flex;
gap:10px;
flex-wrap:wrap;
justify-content:center;
}

.panel{
background:#1c1c1c;
border:1px solid #353535;
border-radius:15px;
padding:12px;
}

.recording{
background:#9e2424!important;
animation:pulse 1s infinite;
}

@keyframes pulse{
50%{opacity:.55}
}

@media(max-width:700px){

.instrument{
height:420px;
border-radius:65px;
}

.logo{
font-size:20px;
}

.neck{
top:17%;
height:66%;
}

.body{
top:9%;
height:82%;
}

.strings{
top:18%;
height:64%;
}

.frets{
top:17%;
height:66%;
}

}

@media(orientation:landscape) and (max-height:600px){

header{
height:52px;
}

.instrument{
height:calc(100vh - 130px);
margin:8px auto;
}

}
</style>
</head>

<body>

<header>

<div>
<div class="logo">🎸 Cep Bağlama</div>
<div class="subtitle">Dijital bağlama • 2. sürüm</div>
</div>

<button id="soundButton">🔊 Sesi Aç</button>

</header>

<div class="controls">

<div class="control">
<div class="control-title">Bağlama</div>

<select id="type">
<option value="kisa">Kısa Sap</option>
<option value="uzun">Uzun Sap</option>
</select>

</div>

<div class="control">
<div class="control-title">Düzen</div>

<select id="tuning">
<option value="baglama">Bağlama Düzeni</option>
<option value="bozuk">Bozuk Düzen</option>
<option value="kara">Kara Düzen</option>
</select>

</div>

<div class="control">

<div class="control-title">Ses</div>

<input
id="volume"
type="range"
min="0"
max="100"
value="75">

</div>

<div class="control">

<div class="control-title">Titreşim</div>

<button id="vibration">Açık</button>

</div>

</div>

<div class="instrument">

<div class="neck"></div>

<div class="body"></div>

<div class="frets" id="frets"></div>

<div class="strings">

<div class="string" data-string="0">
<div class="string-name">SOL</div>
<div class="string-line"></div>
</div>

<div class="string" data-string="1">
<div class="string-name">SOL</div>
<div class="string-line"></div>
</div>

<div class="string" data-string="2">
<div class="string-name">RE</div>
<div class="string-line"></div>
</div>

<div class="string" data-string="3">
<div class="string-name">RE</div>
<div class="string-line"></div>
</div>

<div class="string" data-string="4">
<div class="string-name">LA</div>
<div class="string-line"></div>
</div>

<div class="string" data-string="5">
<div class="string-name">LA</div>
<div class="string-line"></div>
</div>

<div class="string" data-string="6">
<div class="string-name">Mİ</div>
<div class="string-line"></div>
</div>

</div>

</div>

<div class="note-display">

<div class="note" id="note">—</div>

<div class="note-info" id="noteInfo">
Bir tele veya perdeye dokun.
</div>

<div class="mizrap">

<button data-mizrap="down">↓ Aşağı Mızrap</button>

<button data-mizrap="up">↑ Yukarı Mızrap</button>

</div>

</div>

<div class="bottom">

<div class="panel">

<button id="record">🔴 Kayıt</button>

</div>

<div class="panel">

<button id="undo">↩ Son Notayı Sil</button>

</div>

<div class="panel">

<button data-speed="700">🐢 Yavaş</button>

<button data-speed="500">▶ Orta</button>

<button data-speed="320">🔥 Hızlı</button>

</div>

</div>

<script>

let audio=null;
let master=null;

let volume=.75;
let vibration=true;

let currentTuning="baglama";
let currentType="kisa";

let selectedString=0;
let selectedFret=0;

let history=[];

let recording=false;
let recordStart=0;
let recordedNotes=[];

let rhythmTimer=null;

const tunings={

baglama:[
196,
196,
146.83,
146.83,
110,
110,
73.42
],

bozuk:[
196,
196,
146.83,
146.83,
110,
110,
82.41
],

kara:[
220,
220,
164.81,
164.81,
110,
110,
82.41
]

};

const noteNames=[
"DO","DO#","RE","RE#",
"MI","FA","FA#","SOL",
"SOL#","LA","LA#","Sİ"
];

function initAudio(){

if(!audio){

audio=new(
window.AudioContext ||
window.webkitAudioContext
)();

master=audio.createGain();

master.gain.value=volume;

master.connect(audio.destination);

}

if(audio.state==="suspended")
audio.resume();

}

function frequencyFor(string,fret){

let base=
tunings[currentTuning][string];

return base*
Math.pow(2,fret/12);

}

function playNote(string,fret=0){

initAudio();

selectedString=string;
selectedFret=fret;

let frequency=
frequencyFor(string,fret);

let now=audio.currentTime;

let osc=audio.createOscillator();

let gain=audio.createGain();

osc.type="triangle";

osc.frequency.setValueAtTime(
frequency,
now
);

gain.gain.setValueAtTime(
.0001,
now
);

gain.gain.exponentialRampToValueAtTime(
.65,
now+.008
);

gain.gain.exponentialRampToValueAtTime(
.18,
now+.2
);

gain.gain.exponentialRampToValueAtTime(
.0001,
now+2
);

osc.connect(gain);
gain.connect(master);

osc.start(now);
osc.stop(now+2.1);

let harmonic=
audio.createOscillator();

let hg=
audio.createGain();

harmonic.type="sine";

harmonic.frequency.value=
frequency*2;

hg.gain.setValueAtTime(.0001,now);

hg.gain.exponentialRampToValueAtTime(
.12,
now+.01
);

hg.gain.exponentialRampToValueAtTime(
.0001,
now+.8
);

harmonic.connect(hg);
hg.connect(master);

harmonic.start(now);
harmonic.stop(now+.9);

showNote(
string,
fret,
frequency
);

history.push({
string,
fret,
frequency
});

if(recording){

recordedNotes.push({
time:Date.now()-recordStart,
string,
fret
});

}

if(vibration && navigator.vibrate)
navigator.vibrate(12);

}

function showNote(string,fret,frequency){

let midi=
69+
12*Math.log2(frequency/440);

let index=
Math.round(midi)%12;

if(index<0)
index+=12;

let octave=
Math.floor(Math.round(midi)/12)-1;

document.getElementById(
"note"
).textContent=
noteNames[index];

document.getElementById(
"noteInfo"
).textContent=
"Tel "+(string+1)+
" • Perde "+fret+
" • "+frequency.toFixed(1)+" Hz";

let element=
document.querySelector(
'.string[data-string="'+
string+'"]'
);

element.classList.add("hit");

setTimeout(()=>{
element.classList.remove("hit");
},120);

}

document
.querySelectorAll(".string")
.forEach(element=>{

element.addEventListener(
"pointerdown",
e=>{

e.preventDefault();

playNote(
Number(element.dataset.string),
0
);

}
);

});

function createFrets(){

let container=
document.getElementById("frets");

container.innerHTML="";

let count=
currentType==="kisa"
?12
:19;

for(let i=0;i<count;i++){

let fret=
document.createElement("div");

fret.className="fret";

let label=
document.createElement("div");

label.className="fret-label";

label.textContent=i;

fret.appendChild(label);

fret.addEventListener(
"pointerdown",
function(e){

e.preventDefault();

let rect=
fret.getBoundingClientRect();

let stringArea=
document.querySelector(
".strings"
).getBoundingClientRect();

let y=
e.clientY-stringArea.top;

let stringHeight=
stringArea.height/7;

let string=
Math.floor(
y/stringHeight
);

if(string<0)string=0;
if(string>6)string=6;

playNote(
string,
i
);

}
);

container.appendChild(fret);

}

}

document.getElementById(
"type"
).addEventListener(
"change",
function(){

currentType=this.value;

createFrets();

}
);

document.getElementById(
"tuning"
).addEventListener(
"change",
function(){

currentTuning=this.value;

document.getElementById(
"noteInfo"
).textContent=
"Akort değiştirildi.";

}
);

document.getElementById(
"volume"
).addEventListener(
"input",
function(){

volume=
Number(this.value)/100;

if(master)
master.gain.value=volume;

}
);

document.getElementById(
"soundButton"
).addEventListener(
"click",
function(){

initAudio();

this.textContent="🔊 Ses Açık";

}
);

document.getElementById(
"vibration"
).addEventListener(
"click",
function(){

vibration=!vibration;

this.textContent=
vibration
?"Açık"
:"Kapalı";

}
);

document
.querySelectorAll("[data-mizrap]")
.forEach(button=>{

button.addEventListener(
"click",
()=>{

initAudio();

if(selectedString===undefined)
selectedString=0;

playNote(
selectedString,
selectedFret
);

}

);

});

document.getElementById(
"record"
).addEventListener(
"click",
function(){

if(!recording){

recording=true;

recordedNotes=[];

recordStart=Date.now();

this.textContent=
"⏹️ Kaydı Durdur";

this.classList.add(
"recording"
);

}else{

recording=false;

this.textContent=
"🔴 Kayıt";

this.classList.remove(
"recording"
);

let count=
recordedNotes.length;

document.getElementById(
"noteInfo"
).textContent=
"Kayıt tamamlandı • "+
count+" nota";

}

}
);

document.getElementById(
"undo"
).addEventListener(
"click",
function(){

if(history.length===0)
return;

history.pop();

document.getElementById(
"noteInfo"
).textContent=
"Son nota silindi.";

}
);

document
.querySelectorAll("[data-speed]")
.forEach(button=>{

button.addEventListener(
"click",
function(){

if(rhythmTimer){

clearInterval(rhythmTimer);
rhythmTimer=null;

}

let speed=
Number(this.dataset.speed);

initAudio();

rhythmTimer=
setInterval(()=>{

playNote(4,0);

setTimeout(()=>{
playNote(2,0);
},150);

},speed);

document.getElementById(
"noteInfo"
).textContent=
"Ritim açık";

}
);

});

createFrets();

</script>

</body>
</html>
